[project]
name = "model-sitter"
version = "0.1.0"
description = "Experiment logging with run groups: stats, configs, checkpoints and Weights & Biases sync, with or without torch."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Constantinos Tsakonas", email = "tsakonas.constantinos@gmail.com" }
]
keywords = ["experiment-tracking", "logging", "checkpointing", "wandb", "machine-learning", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "pyyaml",
]

# TODO before publishing: point these at the new repo.
# [project.urls]
# Homepage = "https://github.com/<you>/model-sitter"
# Issues = "https://github.com/<you>/model-sitter/issues"

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
torch = ["torch>=2.0"]
media = ["imageio>=2.37.0,<3", "imageio-ffmpeg"]
tyro = ["tyro"]
test = ["pytest"]
all = ["model-sitter[wandb,torch,media,tyro]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosi"]

[tool.hatch.build.targets.sdist]
include = ["mosi", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
